*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.45;overflow-x:hidden;
  background:var(--cuir)}
/* Sous-main de cuir : un calque fixe (pas de background-attachment: fixed), lumière douce en haut. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40rem 26rem at 50% -10%,rgba(255,240,200,.10),transparent 70%),
    radial-gradient(70rem 50rem at 50% 50%,transparent 45%,rgba(0,0,0,.45) 100%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),var(--cuir)}
button,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.page{max-width:460px;margin:0 auto;padding-block:14px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}

/* En-tête : le titre gravé en or, une rosette de billet à gauche. */
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header .rosette{width:46px;height:46px;flex:none;border-radius:50%;background:var(--rosette) center/100% no-repeat,radial-gradient(circle,#f3eedd 0 62%,transparent 63%);
  box-shadow:0 0 0 2px var(--or),0 0 0 4px var(--cuir),0 0 0 5px rgba(184,151,63,.5)}
h1{font-family:var(--titre);font-weight:700;font-size:25px;line-height:1.05;margin:0;letter-spacing:.06em;text-transform:uppercase;color:#e7d6a0;
  text-shadow:0 1px 0 #000}
h1 span{display:block;font-size:.62em;letter-spacing:.2em;color:#b9c7bb;white-space:nowrap}
@media (max-width:389px){h1{font-size:22px}h1 span{letter-spacing:.2em}}
h2{font-family:var(--titre);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin:0;text-align:center}

/* Onglets : deux languettes de papier. */
.onglets{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;z-index:1}
.onglets button{font:700 13px/1.2 var(--titre);letter-spacing:.16em;text-transform:uppercase;padding:10px 6px 9px;cursor:pointer;
  border:0;border-radius:6px 6px 0 0;background:var(--cuir-2);color:#b9c7bb;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.onglets button[aria-selected="true"]{background:var(--papier);color:var(--encre);box-shadow:none}
/* La chemise : papier crème, double filet vert et frise de guilloches, comme le cadre d'un billet. */
.carte{position:relative;background:var(--papier);border-radius:0 0 6px 6px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:440px;
  box-shadow:0 20px 40px -18px #000,inset 0 0 0 6px var(--papier),inset 0 0 0 7px var(--vert),inset 0 0 0 9px var(--papier),inset 0 0 0 10px rgba(47,93,74,.5)}
.carte::before{content:"";position:absolute;left:14px;right:14px;top:12px;height:12px;background:var(--bande) repeat-x;opacity:.55;pointer-events:none}
.carte > :first-child{margin-top:12px}

.entete{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--doux);font-variant-numeric:tabular-nums;gap:8px}
.haut{display:flex;justify-content:space-between;align-items:center;gap:8px}
.score{font-family:var(--titre);font-weight:700;font-size:22px;font-variant-numeric:lining-nums tabular-nums;color:var(--piege)}
/* Progression : une planche de timbres dentelés. */
.progres{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
.progres i{height:12px;border-radius:1px;background:var(--papier-2);outline:1.5px dotted var(--trait);outline-offset:1px}
.progres i.v{background:var(--vert);outline-color:var(--vert)} .progres i.f{background:var(--rouge);outline-color:var(--rouge)}

/* La question : une pièce officielle sur papier filigrané, rosette en filigrane, numéro de série rouge. */
.fiche{position:relative;overflow:hidden;background:var(--filigrane);color:var(--encre);border-radius:3px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;
  border:1.5px solid var(--vert);box-shadow:inset 0 0 0 3px var(--filigrane),inset 0 0 0 4px rgba(47,93,74,.45)}
.fiche::after{content:"";position:absolute;right:-46px;bottom:-46px;width:150px;height:150px;background:var(--rosette) center/100% no-repeat;opacity:.5;pointer-events:none}
.fiche > *{position:relative;z-index:1}
.fiche .serie{position:absolute;top:10px;right:12px;font:700 13px/1 var(--tampon);letter-spacing:.12em;color:var(--rouge)}
.pastille{align-self:flex-start;font:700 11px/1.5 var(--titre);letter-spacing:.2em;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:var(--vert);color:var(--papier)}
.mot{font-family:var(--titre);font-weight:700;font-size:clamp(28px,9vw,40px);line-height:1.05;text-align:center;margin:6px 0;overflow-wrap:normal;word-break:keep-all;hyphens:none;text-wrap:balance;letter-spacing:.03em}
.mot.expr{font-size:clamp(24px,7.5vw,34px)}
.phrase{font-family:var(--texte);font-weight:600;font-size:19px;line-height:1.35;text-align:center;margin:0;text-wrap:balance}
.expr-titre{font-weight:700;font-style:italic;white-space:normal}
.trou{display:inline-block;min-width:3em;border-bottom:2px solid currentColor}
.fiche .chip{background:transparent;border-color:rgba(47,93,74,.45);color:var(--vert)}
.photo{margin:0;display:flex;flex-direction:column;gap:4px}
.photo img{display:block;width:100%;height:200px;object-fit:cover;border-radius:2px;background:var(--papier-2);filter:sepia(.35) saturate(.8);border:4px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.photo figcaption{font-size:11px;color:var(--doux);text-align:right}
.zoom{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.loupe{position:absolute;right:10px;bottom:10px;width:32px;height:32px;display:grid;place-items:center;border-radius:3px;background:rgba(31,42,68,.75);color:#fff;font-size:18px;line-height:1}

/* Les deux pièces à comparer. */
.choix{display:flex;flex-direction:column;gap:10px}
.bouton{font:700 16px/1.25 var(--texte);min-height:52px;padding:12px 14px;border-radius:4px;border:1.5px solid var(--encre);background:var(--fond);color:var(--encre);cursor:pointer;text-align:center;
  box-shadow:0 3px 0 var(--encre);transition:transform .08s}
.bouton:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.bouton:disabled{cursor:default}
.bouton.plein{font-family:var(--titre);letter-spacing:.08em;background:var(--vert);color:var(--papier);border-color:var(--vert-f);box-shadow:0 3px 0 var(--vert-f)}
.bouton.piege{font-family:var(--titre);letter-spacing:.06em;background:var(--rouge);color:#fff6ee;border-color:#7a1f19;box-shadow:0 3px 0 #7a1f19}
.choix .bouton{position:relative;overflow:hidden;text-align:left;font-weight:400;font-size:16px;display:flex;flex-direction:column;gap:8px;
  border:1.5px solid var(--trait);box-shadow:0 1px 0 var(--trait),0 6px 14px -10px rgba(0,0,0,.5);background:var(--creux)}
.choix.duel .bouton:not(.feuillet){min-height:88px;justify-content:center}
.choix .bouton:hover:not(:disabled){border-color:var(--vert)}
.choix .bouton small{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-height:34px}
.choix .bouton.ok{border-color:var(--vert);background:#f1f5ea}
.choix .bouton.ok > span{font-weight:700}
.choix .bouton.demasque > span{opacity:.55}
.choix .bouton.debout{border-color:var(--rouge);background:#fbefe9}
/* Tampons : « Authentique » (timbre vert, rond) et « Contrefaçon » (rouge, de travers sur le faux). */
.chip.bon{font:700 12px/1 var(--tampon);letter-spacing:.16em;text-transform:uppercase;color:var(--vert);background:transparent;
  border:2px solid var(--vert);border-radius:999px;padding:5px 10px;box-shadow:inset 0 0 0 2px var(--creux),inset 0 0 0 3px var(--vert);transform:rotate(-4deg)}
.tampon{position:absolute;right:10px;bottom:8px;font:700 20px/1 var(--tampon);letter-spacing:.14em;text-transform:uppercase;color:var(--rouge);
  border:3px solid var(--rouge);border-radius:4px;padding:5px 9px;transform:rotate(-9deg);opacity:.82;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .choix .bouton.ok .chip.bon{animation:timbre .3s cubic-bezier(.2,1.4,.5,1) both}
  @keyframes timbre{from{opacity:0;transform:scale(1.8) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
  .tampon{animation:tampon .34s .12s cubic-bezier(.2,1.4,.5,1) both}
  @keyframes tampon{from{opacity:0;transform:scale(2) rotate(-16deg)}to{opacity:.82;transform:scale(1) rotate(-9deg)}}
}

/* Verdict : le sceau de cire (intact quand on démasque, brisé quand on est dupé), la phrase, le gain. */
.verdict{display:flex;align-items:center;gap:12px;min-height:58px}
.sceau{width:52px;height:52px;flex:none;display:block}
.verdict .dit{flex:1;margin:0;font-family:var(--titre);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--encre)}
.gain{font-family:var(--titre);font-weight:700;font-size:30px;line-height:1;color:var(--piege);display:inline-flex;align-items:center;gap:2px;font-variant-numeric:lining-nums}
@media (prefers-reduced-motion:no-preference){
  .sceau.pose{animation:pose .36s cubic-bezier(.2,1.5,.5,1) both}
  @keyframes pose{from{opacity:0;transform:scale(1.6) rotate(-20deg)}to{opacity:1;transform:none}}
  .apparait{animation:ap .22s ease-out}
  @keyframes ap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

.ligne{display:flex;gap:8px}
.ligne .bouton{flex:1 1 0;min-width:0}
.ligne .bouton[aria-label="Retour"]{flex:0 0 56px;padding-inline:0}
.ligne .bouton.piege{flex-grow:1.6}
textarea{font:400 17px/1.4 var(--texte);font-style:italic;width:100%;min-height:76px;padding:12px;border-radius:3px;border:1.5px solid var(--trait);color:var(--piege);resize:vertical;
  background:repeating-linear-gradient(transparent 0 23px,rgba(43,58,107,.12) 23px 24px) 0 9px/100% 24px,var(--creux)}
label{font:700 12px/1.4 var(--titre);letter-spacing:.14em;text-transform:uppercase;color:var(--vert)}
.compte{margin-top:-8px;font-size:12.5px;color:var(--doux);text-align:right;font-variant-numeric:tabular-nums}
.vraie-piege{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px;border:1.5px solid var(--vert);border-radius:3px;background:#f1f5ea;font-weight:700}
.gros{font-family:var(--titre);font-weight:700;font-size:60px;text-align:center;line-height:1;margin:4px 0 0;font-variant-numeric:lining-nums;display:flex;justify-content:center;align-items:center;gap:4px}
.gros .ic{width:.7em;height:.7em}
.centre{text-align:center;margin:0;color:var(--doux)}
.liste{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.liste li{position:relative;border:1.5px solid var(--trait);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--creux)}
.liste .m{font-family:var(--titre);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--vert)}
.liste .stat{font-size:13px;color:var(--doux);font-variant-numeric:tabular-nums}
.liste li.eteint{opacity:.55}
.barre{height:6px;border-radius:1px;background:var(--papier-2);overflow:hidden}
.barre i{display:block;height:100%;background:var(--piege);transform-origin:left}
.note{font:11px/1.4 var(--titre);color:#8fa596;margin:10px 0 0;text-align:center;letter-spacing:.18em;text-transform:uppercase}
.etat{font-size:12.5px;font-weight:700;color:var(--vert)}
.etat.mort{color:var(--rouge)} .etat.star{color:var(--piege)}
.victimes{display:flex;flex-wrap:wrap;gap:6px}
.victime{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 2px;border-radius:3px;background:rgba(179,50,42,.1);font-size:14px;font-weight:700}
.victime b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--rouge);color:#fff;font:700 12px var(--titre)}
/* Le sceau du faux : chaque démasquage en brise un cran. */
.meche{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.meche i{width:12px;height:12px;justify-self:center;border-radius:50%;background:var(--rouge)}
.meche i.brule{background:transparent;box-shadow:inset 0 0 0 1.5px var(--trait)}
.alerte{border:1.5px dashed var(--rouge);border-radius:3px;padding:12px;font-size:14px;margin:0;color:var(--rouge);background:#fbefe9}
.jauge-ecus{display:flex;align-items:center;gap:8px}
.jauge-ecus .barre{flex:1}
.signal{text-align:center;font-size:12.5px;color:var(--doux);margin-top:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.lien{background:none;border:0;padding:4px 2px;font:inherit;font-size:12.5px;color:var(--doux);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:3px;background:var(--creux);border:1.5px solid var(--trait);font:700 14px/1.2 var(--titre);color:var(--encre);white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.chip.ecu{color:var(--ecu);border-color:rgba(154,116,36,.45)}
.chip.ecu .ic,.gros .ic,.gain .ic,.bouton .ic{width:1.15em;height:1.15em}
.chip.faux{color:var(--rouge);border-color:rgba(179,50,42,.45)}
.chip.or{background:var(--or);border-color:var(--or);color:#2a210a}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tuile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;font:700 12px/1.2 var(--titre);letter-spacing:.12em;text-transform:uppercase;
  border-radius:3px;border:1.5px solid var(--trait);background:var(--creux);color:var(--encre);cursor:pointer;box-shadow:0 1px 0 var(--trait)}
.tuile .ic{width:28px;height:28px;color:var(--vert)}
.tuile:hover:not(:disabled){border-color:var(--vert)}
.tuile:disabled{opacity:.35;cursor:default}
.reserve{display:flex;justify-content:center;gap:6px;font-size:34px;color:var(--piege)}
.reserve .vide{color:var(--trait)}
.grosse-ic{display:flex;justify-content:center;color:var(--vert)}
.grosse-ic .ic{width:56px;height:56px}
.cases{display:flex;justify-content:center;gap:4px}
.cases i{width:14px;height:14px;border-radius:1px;background:var(--rouge);outline:1.5px dotted var(--rouge);outline-offset:1px}
.cases i.v{background:var(--vert);outline-color:var(--vert)}
.visionneuse{position:fixed;inset:0;z-index:50;background:rgba(13,23,18,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.visionneuse img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:2px}
.visionneuse p{margin:0;color:#d8d8d8;font-size:12px;text-align:center}
.visionneuse button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:3px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
/* Sous-onglets de l'atelier : deux languettes d'un même cartouche. */
.sous-onglets{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--vert);border-radius:3px;overflow:hidden}
.sous-onglets button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font:700 12px/1.2 var(--titre);letter-spacing:.12em;text-transform:uppercase;border:0;background:var(--creux);color:var(--vert);cursor:pointer}
.sous-onglets button + button{border-left:1.5px solid var(--vert)}
.sous-onglets button[aria-selected="true"]{background:var(--vert);color:var(--papier)}
.sous-onglets .nb{font:700 13px/1 var(--texte);padding:2px 6px;border-radius:2px;background:rgba(47,93,74,.14)}
.sous-onglets [aria-selected="true"] .nb{background:rgba(243,238,221,.2)}
/* Dupé : un coup de tampon rouge, comme « Contrefaçon ». */
.tampon-dupe{flex:none;font:700 19px/1 var(--tampon);letter-spacing:.14em;text-transform:uppercase;color:var(--rouge);border:3px solid var(--rouge);border-radius:4px;padding:8px 10px;
  box-shadow:inset 0 0 0 2px var(--papier),inset 0 0 0 3px var(--rouge);transform:rotate(-7deg);opacity:.88}
@media (prefers-reduced-motion:no-preference){.tampon-dupe{animation:dupe .32s cubic-bezier(.2,1.4,.5,1) both}
  @keyframes dupe{from{opacity:0;transform:scale(1.9) rotate(-14deg)}to{opacity:.88;transform:rotate(-7deg)}}}
/* Signature : le pseudo, à la plume, sur une ligne pointillée. */
.signature{display:flex;align-items:center;gap:10px;min-height:44px}
.signature .signe{font:700 12px/1 var(--titre);letter-spacing:.16em;text-transform:uppercase;color:var(--vert)}
.nom-signe{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 4px;border:0;border-bottom:1.5px dotted var(--encre);background:none;
  font:italic 400 20px/1.2 var(--texte);color:var(--piege);cursor:pointer;text-align:left}
.nom-signe .ic{color:var(--vert)}
#pseudoChamp{flex:1;min-width:0;min-height:44px;padding:0 8px;border:0;border-bottom:1.5px solid var(--vert);background:var(--creux);font:italic 400 20px/1.2 var(--texte);color:var(--piege)}
#pseudoChamp:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#pseudoChamp.refus{border-bottom-color:var(--rouge);background:#fbefe9}
.bouton.petit{min-height:44px;min-width:48px;padding:0 12px}
/* Piéger en direct : à gauche de « Suivante », plus petit ; grisé tant qu'il manque des écus. */
.ligne.direct .bouton.plein{flex:1.6 1 0}
.ligne.direct .bouton.piege{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:var(--texte);font-variant-numeric:lining-nums}
.ligne.direct .bouton.piege:disabled{background:var(--creux);color:var(--doux);border-color:var(--trait);box-shadow:0 3px 0 var(--trait)}
/* Fin de la ration : sablier et compte à rebours jusqu'à minuit (heure de Paris). */
.demain{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font:700 40px/1 var(--texte);color:var(--vert);font-variant-numeric:lining-nums tabular-nums}
.demain .sablier .ic{width:40px;height:40px}
/* Signatures à la plume (Caveat) : sur le faux révélé, au bas de la carte de pose, dans Mes faux. */
.signe-faux{font:700 20px/1 "Caveat",cursive;color:var(--piege);transform:rotate(-3deg);transform-origin:left}
.signe-faux i{font:italic 400 12px var(--texte);color:var(--doux);margin-right:2px}
.signe-faux.dupe{color:var(--rouge)}
.signer{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:-6px;text-transform:none;letter-spacing:0}
.signer i{font:italic 400 13px var(--texte);color:var(--doux)}
#signeChamp{width:60%;min-height:40px;padding:0 6px;border:0;border-bottom:1.5px dotted var(--encre);background:none;font:700 24px/1 "Caveat",cursive;color:var(--piege)}
#signeChamp:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#signeChamp.refus{border-bottom:1.5px solid var(--rouge);background:#fbefe9}
.nom-signe{font:700 26px/1.1 "Caveat",cursive}
/* Les deux pièces : une frise de guilloches en tête, comme sur un document officiel. */
.choix.duel .bouton{padding-top:20px}
.choix.duel .bouton::before{content:"";position:absolute;left:10px;right:10px;top:6px;height:8px;background:var(--bande) repeat-x 0 0/16px 8px;opacity:.3;pointer-events:none}
.choix.duel .bouton.ok::before{opacity:.6}
.choix.duel .bouton.debout::before{opacity:0}
/* Verdict dans un cartouche. */
.verdict{padding:8px 12px;border:1.5px solid var(--trait);border-radius:4px;background:var(--creux)}
/* --- Feuillets d'ouvrages anciens (les deux pièces du duel) ---------------------------
   Papier vieilli : rousseurs, bords brunis, bord frangé (clip-path), caractères IM Fell. */
.choix.feuillets{position:relative;gap:14px;padding:4px 2px}
.choix .bouton.feuillet,.feuillet.modele{position:relative;display:flex;flex-direction:column;gap:6px;min-height:0;padding:12px 16px 12px;text-align:left;border:0;border-radius:0;color:#2b2016;cursor:pointer;
  background:radial-gradient(circle at 18% 22%,rgba(150,95,40,.16) 0 3px,transparent 4px),radial-gradient(circle at 74% 64%,rgba(150,95,40,.12) 0 5px,transparent 7px),radial-gradient(circle at 88% 18%,rgba(150,95,40,.1) 0 2px,transparent 3px),radial-gradient(120% 120% at 50% 50%,var(--p1,#f1e5c6) 45%,var(--p2,#dfca9d) 85%,var(--p3,#cdb078) 100%);
  box-shadow:inset 0 -3px 0 rgba(120,85,40,.18),inset 0 0 18px rgba(120,85,40,.12);
  clip-path:polygon(0 1.5%,4% 0,9% 1.2%,15% 0,22% 1%,30% 0,38% 1.2%,47% 0,55% 1%,63% 0,71% 1.3%,80% 0,88% 1%,95% 0,100% 1.5%,99.3% 15%,100% 30%,99.4% 45%,100% 60%,99.2% 75%,100% 90%,99.5% 100%,90% 98.8%,80% 100%,70% 98.9%,60% 100%,50% 99%,40% 100%,30% 98.8%,20% 100%,10% 99%,0 100%,.7% 85%,0 70%,.6% 55%,0 40%,.7% 25%,0 12%)}
/* Chaque feuillet a son calque dès l'affichage du duel : sans lui, chaque image de la révélation
   repeignait le feuillet découpé (clip-path) et ses dégradés (rastérisation 307 → 31 ms par
   révélation, processeur ralenti ×4, docs/direction-artistique.md). */
.choix .bouton.feuillet{will-change:transform;transition:none}
.choix .bouton.feuillet::after{will-change:opacity}
.choix .bouton.feuillet:nth-child(1){transform:rotate(-.7deg)}.choix .bouton.feuillet:nth-child(2){transform:rotate(.6deg)}
.choix .bouton.feuillet::before{content:none}
.choix .bouton.feuillet:active:not(:disabled){transform:scale(.985)}
.choix .bouton.joue{cursor:default}
.choix .bouton.joue:active{transform:none}
.f-tete{display:flex;justify-content:space-between;font:12px "IM Fell English SC",Georgia,serif;letter-spacing:.06em;border-bottom:1px solid rgba(43,32,22,.55);padding-bottom:3px}
.f-art{font:400 18px/1.32 "IM Fell English",Georgia,serif;text-align:left}
.f-art .vedette{font:400 19px "IM Fell English SC",Georgia,serif;letter-spacing:.03em}
.f-art i,.f-art em{font-style:italic}
.f-pied{display:flex;justify-content:space-between;gap:10px;margin-top:auto;font:italic 12px "IM Fell English",Georgia,serif;color:rgba(43,32,22,.7)}
.f-pied span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feuillet small{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:30px;font-size:13px}
.feuillet small[hidden]{display:none}
.feuillet .tampon{position:relative;right:auto;bottom:auto;font-size:15px;padding:3px 8px}
.feuillet .signe-faux{margin-left:auto}
.feuillet .chip.bon{background:rgba(241,229,198,.85)}
.feuillet.modele .chip.bon{position:absolute;right:12px;bottom:10px;z-index:2}
.feuillet.modele{padding-bottom:44px}
.feuillet.modele{cursor:default;min-height:0;transform:rotate(-.5deg)}

.choix .bouton.feuillet.ok > .f-art{font-weight:400}

.choix .bouton.feuillet.demasque > span{opacity:1}
.choix .bouton.feuillet.demasque .rep{text-decoration:line-through;text-decoration-color:rgba(179,50,42,.65)}
/* Sous la lampe : un voile violet sur la table (opacité seule), le faux s'allume, le vrai s'éteint.
   Les couleurs du texte changent d'un coup (pas de transition de couleur) ; seuls les calques
   « peau-uv » et le voile s'animent, en opacité. */
.peau-uv{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:0;transition:opacity .45s ease-out}
.feuillet > .f-tete,.feuillet > .f-art,.feuillet > .f-pied,.feuillet > small{position:relative;z-index:1}
.choix.feuillets::before{content:"";position:absolute;inset:-10px -8px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .45s ease-out;
  background:radial-gradient(90% 70% at 50% 0%,#4a2a86 0%,#24123f 60%,#140a26 100%)}
.choix.feuillets.sous-lampe::before{opacity:1}
.sous-lampe .feuillet .peau-uv{opacity:1}
.sous-lampe .feuillet.ok .peau-uv{background:radial-gradient(120% 120% at 50% 50%,#43375a 40%,#2c2343 100%),var(--rosette) 85% 60%/110px no-repeat}
.sous-lampe .feuillet.ok .peau-uv::after{content:"";position:absolute;right:12px;top:24px;width:96px;height:96px;background:var(--rosette) center/100% no-repeat;opacity:.4;filter:invert(1)}

.sous-lampe .feuillet.ok .f-tete{border-color:rgba(169,156,198,.4)}.sous-lampe .feuillet.ok .f-pied{color:#8a7fab}
.sous-lampe .feuillet.ok .chip.bon{background:rgba(44,35,67,.9);color:#7de0a8;border-color:#7de0a8;box-shadow:inset 0 0 0 2px #2c2343,inset 0 0 0 3px #7de0a8}
.sous-lampe .feuillet:not(.ok) .peau-uv{background:radial-gradient(120% 120% at 50% 50%,#e3f1ff 30%,#a8cdff 80%,#86b3ff 100%)}
.sous-lampe .feuillet:not(.ok){color:#22306a}
.sous-lampe .feuillet:not(.ok) .f-tete{border-color:rgba(34,48,106,.5)}.sous-lampe .feuillet:not(.ok) .f-pied{color:#3a4a88}
.sous-lampe .signe-faux{color:#1f4fff}.sous-lampe .signe-faux.dupe{color:#1f4fff}

/* Catégorie du faux (définitions) : le faussaire peut la fausser aussi. */
.categories{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.cat{min-height:36px;padding:0 12px;border-radius:3px;border:1.5px solid var(--trait);background:var(--creux);font:italic 16px "IM Fell English",Georgia,serif;color:var(--encre);cursor:pointer}
.cat[aria-checked="true"]{background:var(--vert);border-color:var(--vert);color:var(--papier)}
/* Salle des ventes : une ligne au-dessus des deux pièces, dans le ton du catalogue. */
.consigne-achat{margin:-4px 0 -6px;text-align:center;font:700 11px/1.4 var(--titre);letter-spacing:.22em;text-transform:uppercase;color:var(--doux)}
/* Étiquette d'achat : un ticket de carton percé, sur la pièce choisie. */
.etiquette{position:relative;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 16px;font:700 11px/1.2 var(--titre);letter-spacing:.14em;text-transform:uppercase;
  color:#4a3618;background:#e9d29a;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);transform:rotate(-4deg)}
.etiquette::before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#f1e5c6}
/* Ligne du lot (famille, numéro) et planche de la photo, à la place de la question d'en-tête. */
.lot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-4px}
.lot .pastille{align-self:auto}
.n-lot{font:700 13px/1 var(--tampon);letter-spacing:.12em;color:var(--rouge)}
.photo.planche{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center;background:var(--filigrane);padding:8px;border:1.5px solid var(--vert);border-radius:3px}
.photo.planche img{height:96px;border:3px solid #fff}

.photo.planche figcaption{display:flex;flex-direction:column;gap:2px;text-align:left}
.photo.planche .legende{font:600 16px/1.3 var(--texte);color:var(--encre)}
.photo.planche .credit{font-size:11px;color:var(--doux);text-align:right}

   dans le premier écran. En-tête resserré, feuillets un peu plus serrés, planche photo réduite. */
@media (max-height:700px){
  header{margin-bottom:6px} header .rosette{width:36px;height:36px} h1{font-size:21px}
  .carte{padding:14px 12px 12px;gap:10px}

/* Très court (iPhone SE en Safari, 553 px) : l'en-tête courant et le pied des feuillets, décoratifs,

/* Planche illustrée (photo) : la photo et sa légende dans le même feuillet. */

.f-zoom{position:relative;display:block;cursor:zoom-in}

@media (max-height:700px){.f-planche{grid-template-columns:80px 1fr}.f-planche img{width:80px;height:80px}.f-planche .f-art{font-size:14.5px}}
/* --- Révélation : séquence d'environ 1,3 s, transform et opacity seulement ------------------
   0 ms     la pièce achetée s'enfonce puis se soulève ; l'étiquette « Acheté » s'épingle

            l'illumine (or si c'est la pièce d'époque, rouge si c'est un faux) ; floué : la table tremble

  @keyframes achat-floue1{0%{transform:rotate(-.7deg) scale(.95)}17%{transform:rotate(-.7deg) scale(1.025)}29%,59%{transform:rotate(-.7deg)}64%{transform:rotate(-.7deg) translateX(-7px)}69%{transform:rotate(-.7deg) translateX(6px)}74%{transform:rotate(-.7deg) translateX(-4px)}79%{transform:rotate(-.7deg) translateX(2px)}84%,100%{transform:rotate(-.7deg)}}
  @keyframes choc1{0%{transform:rotate(-.7deg) scale(.97)}100%{transform:rotate(-.7deg)}}
  .choix.revele .bouton.feuillet:nth-child(2).choisi{animation:achat-bien2 1.02s linear}
  .choix.revele.floue .bouton.feuillet:nth-child(2).choisi{animation:achat-floue2 1.02s linear}
  .choix.revele .bouton.feuillet:nth-child(2).autre{animation:choc2 .3s 1.05s ease-out}

// Vocabulaire de la salle des ventes (demande de l'auteur, 23/11/2026) : on achète les pièces
// d'époque, on met des faux sur le marché (docs/conception.md, « Lexique »).
const REPLIQUES = { juste: ["Bonne affaire.", "Pièce d'époque acquise."], cru: ["On t'a refourgué un faux.", "Tu as acheté un faux."] };
const replique = k => REPLIQUES[k][Math.floor(Math.random() * REPLIQUES[k].length)];
const numero = id => { let n = 0; for (const c of String(id)) n = (n * 31 + c.charCodeAt(0)) % 9000; return `Lot ${"ABCDEFGHJK"[n % 10]}·${String(1000 + n).padStart(4, "0")}`; };
/* Un mot ne se coupe jamais en deux : s'il dépasse la fiche, sa police rétrécit jusqu'à
   tenir sur la largeur (9 px au plus petit : la phobie de 36 lettres sur un écran de 320 px). Une lecture et une écriture par mot, à
   l'image suivante, après chaque affichage et quand les polices arrivent. */
function ajusterMots() {
  const els = [...$e.querySelectorAll(".mot")];
  els.forEach(el => { el.style.fontSize = ""; el.style.letterSpacing = ""; });
  const mesures = els.map(el => [el, el.clientWidth, el.scrollWidth, parseFloat(getComputedStyle(el).fontSize)]);
  // Espacement des lettres en em : il rétrécit avec la police ; on le resserre aussi (0,03 → 0).
  for (const [el, w, sw, fs] of mesures) if (sw > w + 1) { el.style.letterSpacing = "0"; el.style.fontSize = Math.max(9, Math.floor(fs * w / sw * 1.02)) + "px"; }
  // Vérification : si l'arrondi déborde encore, un pixel de moins (une seule relecture, mots trop longs seulement).
  for (const [el] of mesures) if (el.style.fontSize && el.scrollWidth > el.clientWidth + 1) el.style.fontSize = Math.max(9, parseFloat(el.style.fontSize) - 1) + "px";
}
let ajustement = 0;
new MutationObserver(() => { cancelAnimationFrame(ajustement); ajustement = requestAnimationFrame(ajusterMots); }).observe($e, { childList: true });
if (document.fonts) document.fonts.ready.then(ajusterMots);
const pastilleEcus = (n, signe = "") => `<span class="chip ecu" aria-label="${signe}${n} écu${Math.abs(n) > 1 ? "s" : ""}">${signe}${n}${IC.ecu}</span>`;

function fermerVisionneuse() { const v = document.querySelector(".visionneuse"); if (v) { v.remove(); document.removeEventListener("keydown", echap); } }
function echap(e) { if (e.key === "Escape") fermerVisionneuse(); }
function ouvrirVisionneuse(img, texte) {
  const v = document.createElement("div"); v.className = "visionneuse"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Image agrandie");
  const grand = document.createElement("img"); grand.src = img.src; grand.alt = img.alt;
  const legende = document.createElement("p"); legende.textContent = texte || "";
  const fermer = document.createElement("button"); fermer.type = "button"; fermer.setAttribute("aria-label", "Fermer"); fermer.textContent = "×";
  v.append(fermer, grand, legende); v.onclick = fermerVisionneuse;
  document.body.append(v); document.addEventListener("keydown", echap); fermer.focus();
}

   [proximité au plus proche mot de la vraie définition, proximité au mot lui-même].
   Score = max(moyenne des proximités des mots du piège, mot du piège le plus proche du mot).
   Mesure : 25 reformulations de vraies définitions et 75 pièges de Truffe, seuil 0,5 :
   22 reformulations refusées, 1 piège honnête refusé à tort. */
let PROCHES = null, COMMUNES = null;

// ignorés des deux côtés : sans ça, 19 pièges honnêtes sur 48 étaient refusés.
async function memeSens(motId, piege, seuil, cadre) {
  const L = PROCHES && PROCHES.mots[motId]; if (!L) return false;
  const C = new Set(cadre || []);
  const ws = (piege.toLowerCase().match(/[a-zàâäéèêëîïôöùûüçœ-]+/g) || []).filter(w => !PROCHES.videsSet.has(w) && !C.has(w));
  if (!ws.length) return false;
  const al = ws.reduce((s, w) => s + (L[w] ? L[w][0] : PROCHES.inconnu), 0) / ws.length;
  const ci = Math.max(0, ...ws.map(w => L[w] ? L[w][1] : 0));

}

/* Mise en forme d'un piège au format des vraies réponses de sa famille, pour qu'il ne se trahisse pas :
   - commune : majuscule à chaque partie du nom (« Saint-Jean-sur-Loire »), petits mots en minuscule, sans point ;
   - toutes les autres familles : majuscule au début et après . ! ?, point final s'il manque.
   Appliquée à l'enregistrement et à l'affichage : les réponses déjà en base suivent le même canevas. */
const PETITS = new Set(["le", "la", "les", "l", "de", "du", "des", "d", "sur", "sous", "en", "et", "aux", "au", "lez", "lès"]);
function formater(brut, f) {
  let t = String(brut).replace(/\s+/g, " ").trim();
  if (!t) return t;
  const maj = s => s.charAt(0).toLocaleUpperCase("fr") + s.slice(1);
  if (f === "commune") {
    t = t.replace(/[.!?]+$/, "").trim();
    // Espaces → traits d'union, comme dans les vrais noms, sauf après un article initial (Le Mans, La Rochelle).
    const art = t.match(/^(le|la|les)\s+/i);
    t = (art ? art[0].trim() + " " : "") + t.slice(art ? art[0].length : 0).replace(/\s+/g, "-");
    let i = 0;
    return t.split(/([-\s']+)/).map(p => { if (/^[-\s']+$/.test(p) || !p) return p; const premier = i++ === 0; return !premier && PETITS.has(p.toLowerCase()) ? p.toLowerCase() : maj(p.toLowerCase()); }).join("");
  }
  t = maj(t).replace(/([.!?]\s+)(\p{Ll})/gu, (_, a, b) => a + b.toLocaleUpperCase("fr"));
  if (!/[.!?…]$/.test(t)) t += ".";

}

  // Les régions entre parenthèses (« (Marseille) ») ne comptent pas ; un seul mot commun ne suffit pas,
  // sauf si la vraie définition est entièrement reprise.

   Juste : +1 écu. Faux : le piège fait du joueur sa victime (+1 écu à son auteur). Le score de la partie, ce sont les écus gagnés.
   Un piège coûte 10 écus ; 10 offerts au départ. Les deux choix : plus nerveux, et un seul piège suffit

  const rendus = I.piegesMoi.reduce((t, p) => t + (I.pris.get(p.id) || 0), 0);

/* Ration du jour : TOTAL duels par jour, heure de Paris (décision de l'auteur, 23/11/2026).
   Plus de partie avec un score à battre : on joue pour remplir son encrier, la ration donne
   le rythme, et c'est elle qui se vendra (docs/conception.md). Elle se compte sur les choix

const aujourdhui = () => jourDe(Date.now());

/* Limite du jour coupée pour les essais (demande de l'auteur, 23/11/2026) : les 15 duels sont

function nouvelleSerie() {

  serie = { jour: aujourdhui(), num: faits.length, points: faits.reduce((t, c) => t + (c.gain || 0), 0), serie: 0, meilleure: 0,
    traces: faits.map(c => c.erreur ? 0 : 1), pieges: 0, piegeur: new Map(), derniere: null, tour: [] };
  for (const c of faits) if (c.erreur) for (const id of c.montres || []) { const a = auteurs.get(id); if (a) serie.piegeur.set(a, (serie.piegeur.get(a) || 0) + 1); }

// Les familles passent toutes une fois par tour, dans un ordre tiré au hasard à chaque tour ;
// un tour ne commence jamais par la famille qui a fini le précédent (pas deux fois de suite).
function choisir(ids) {
  const par = new Map(); for (const id of ids) { const f = famille(S.mots.get(id)); if (!par.has(f)) par.set(f, []); par.get(f).push(id); }
  for (let essai = 0; essai < 2; essai++) {
    while (serie.tour.length) {
      const f = serie.tour.shift();
      if (par.has(f)) { serie.derniere = f; return melange(par.get(f))[0]; }
    }
    let t = melange(ORDRE);
    if (t[0] === serie.derniere && t.length > 1) t.push(t.shift());
    serie.tour = t;

function motsEnJeu(I) {

    if (I.vusMoi.has(id) || I.motsPiegesMoi.has(id)) continue;
    const ps = (I.vivants.get(id) || []).filter(p => p.auteur !== moi);

// Le poseur voit la vraie réponse : celles qu'il a déjà jouées passent d'abord (rien n'est
// gâché) ; une question neuve vue en piégeant sort de ses parties (vusLocal). Dans la famille, la question qui a le moins
// de pièges en vie (sinon tout le monde piégerait les mêmes).
function aPieger(I) {
  const neuves = new Map(), jouees = new Map();
  for (const [id, m] of S.mots) {
    if (I.motsPiegesMoi.has(id)) continue;
    const f = famille(m), cible = I.vusMoi.has(id) ? jouees : neuves;
    if (!cible.has(f)) cible.set(f, []);

  // toutes les réponses (remarque de l'auteur, 23/11/2026). Un lot neuf se contrefait en direct,

    // épuisée repart du début, et on peut enchaîner les pièges dans la même famille.
    let r = tout.filter(x => !ecartes.has(x[0]));

    dernierMot = id; return id;
  }
  const par = new Map();
  for (const [id, m] of S.mots) {
    if (I.vusMoi.has(id) || I.motsPiegesMoi.has(id)) continue;
    const f = famille(m); if (!par.has(f)) par.set(f, []);
    par.get(f).push([id, (I.vivants.get(id) || []).length]);

// Le piège opposé à la vérité : le plus efficace, sauf 4 fois sur 10 un piège encore peu vu (sa chance).
function adversaire(I, ps) {
  const neufs = ps.filter(p => (I.vu.get(p.id) || 0) < 3);
  if (neufs.length && Math.random() < 0.4) return melange(neufs)[0];
  return ps.slice().sort((a, b) => taux(I, b.id) - taux(I, a.id))[0];
}

const VRAI = `<span class="chip bon">D'époque</span>`;

async function question(motId, I) {
  const m = S.mots.get(motId);

  const piege = adversaire(I, ps);
  const f = famille(m);
  const options = melange([{id: "vrai", texte: formater(m.vraie, f), categorie: m.categorie}, {id: piege.id, texte: formater(piege.texte, f), auteur: piege.auteur, categorie: piege.categorie || m.categorie}]);
  await nommer([piege.auteur]);
  serie.enCours = { motId, options, piege };

}

  const I = index(), s = solde(I), par = aPieger(I);
  if (s < PRIX_PIEGE) {
    $e.innerHTML = `${retour === atelier ? sousOnglets("fabriquer", I) : ""}${enteteEcus(s)}
      <div class="grosse-ic apparait">${IC.piege}</div>
      ${reserve(s)}
      <button class="bouton plein" type="button" id="retour" style="width:100%">Expertise</button>`;
    document.getElementById("retour").onclick = () => (retour === atelier ? montrer("jouer") : nouvelleSerie()); if (retour === atelier) lierSous(); return;
  }
  const dansAtelier = retour === atelier;
  $e.innerHTML = `${dansAtelier ? sousOnglets("fabriquer", I) : ""}${enteteEcus(s)}
    ${par.size ? "" : `<div class="grosse-ic">${IC.piege}</div><p class="centre">Expertise d'abord des lots : tu contreferas ceux que tu connais.</p>`}<div class="tuiles apparait">${ORDRE.filter(f => par.has(f)).map(f => `<button class="tuile" type="button" data-f="${f}">${IC[f]}${FAMILLES[f].label}<span class="nb-tuile">${par.get(f).length}</span></button>`).join("")}${dansAtelier ? "" : `<button class="tuile" type="button" id="retour" aria-label="Retour">${IC.croix}</button>`}</div>`;
  $e.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const id = motAtelier(index(), b.dataset.f); if (id) cartePiege(id, retour); });
  if (dansAtelier) lierSous(); else document.getElementById("retour").onclick = retour;
}

function cartePiege(motId, retour, prix = PRIX_PIEGE) {
  const m = S.mots.get(motId), F = FAMILLES[famille(m)], direct = prix !== PRIX_PIEGE;
  $e.innerHTML = `${enteteEcus(solde(index()), prix)}
    ${lot(m, motId, true)}
    <div class="original apparait"><span class="chip bon">D'époque</span><span>${esc(formater(m.vraie, famille(m)))}</span></div>
    <p class="titre-apercu">Ta contrefaçon</p>
    <div class="feuillet modele apercu vide" id="apercu" ${attrsFeuillet(m, motId)}>${feuillet(m, motId, formater(m.vraie, famille(m)), m.categorie)}</div>
    ${famille(m) === "definition" ? `<div class="categories" role="radiogroup" aria-label="Catégorie de ton faux">${CATEGORIES.map(c => `<button type="button" role="radio" class="cat" data-cat="${c}" aria-checked="${c === (m.categorie || "n. m.")}">${c}</button>`).join("")}</div>` : ""}
    <textarea id="piegeTexte" maxlength="${F.max}" aria-label="${F.champ}" placeholder="${esc(formater(m.vraie, famille(m)))}"></textarea>
    <div class="sous-saisie"><label class="signer"><i>signé</i><input id="signeChamp" maxlength="${PSEUDO_MAX}" autocomplete="nickname" aria-label="Ta signature" placeholder="ton nom de faussaire" value="${esc(signatureProposee())}"></label><span class="compte" id="compte">0 / ${F.max}</span></div>
    <div id="erreurPiege"></div>
    <div class="ligne"><button class="bouton" type="button" id="passer" aria-label="Retour">${IC.croix}</button>${direct ? "" : `<button class="bouton" type="button" id="autre">Autre</button>`}<button class="bouton piege" type="button" id="poser">Mettre en vente</button></div>`;
  const ta = document.getElementById("piegeTexte");
  // Aperçu : le faux s'écrit dans l'emplacement de la réponse, sur le même artefact que l'original.
  const apercu = document.getElementById("apercu"); let rafApercu = 0;
  const majApercu = () => { cancelAnimationFrame(rafApercu); rafApercu = requestAnimationFrame(() => {
    const cat = $e.querySelector('.cat[aria-checked="true"]');
    // Champ vide : le texte d'origine, grisé, à l'emplacement qu'il va remplacer.
    const vide = !ta.value.trim(); apercu.classList.toggle("vide", vide);
    apercu.innerHTML = feuillet(m, motId, formater(vide ? m.vraie : ta.value, famille(m)), cat ? cat.dataset.cat : m.categorie); }); };
  ta.oninput = () => { document.getElementById("compte").textContent = `${ta.value.length} / ${F.max}`; majApercu(); };
  document.getElementById("signeChamp").oninput = e => e.target.classList.remove("refus");
  // Catégorie du faux : le faussaire peut la fausser aussi (« sapajou, adj. »).
  $e.querySelectorAll(".cat").forEach(b => b.onclick = () => { $e.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false")); majApercu(); });
  document.getElementById("passer").onclick = () => { vusLocal.add(motId); retour(); };
  if (!direct) {
  const autreQuestion = () => { ecartes.add(motId); vusLocal.add(motId); const id = motAtelier(index(), famille(m)); if (id) cartePiege(id, retour); else choixFamille(retour); };
  document.getElementById("autre").onclick = autreQuestion;
  }
  const libelle = document.getElementById("poser").innerHTML;
  document.getElementById("poser").onclick = async () => {
    const texte = formater(ta.value, famille(m));
    const err = document.getElementById("erreurPiege");
    const commune = famille(m) === "commune";
    if (texte.length < (commune ? 3 : 8)) { err.innerHTML = `<p class="alerte">Trop court.</p>`; return; }
    if (commune && COMMUNES && COMMUNES.has(nomCommune(texte))) {
      if (nomCommune(texte) === nomCommune(m.vraie)) {
        vusLocal.add(motId);
        err.innerHTML = `<p class="alerte">${IC.ok} C'est la vraie !</p>`;
        $e.querySelector(".ligne").innerHTML = `<button class="bouton" type="button" id="passer" aria-label="Retour">${IC.croix}</button>${direct ? "" : `<button class="bouton piege" type="button" id="autre">Autre</button>`}`;
        document.getElementById("passer").onclick = retour;
        if (!direct) document.getElementById("autre").onclick = autreQuestion;
      } else err.innerHTML = `<p class="alerte">Cette commune existe vraiment.</p>`;
      return;
    }
    const poser = document.getElementById("poser");
    poser.disabled = true; poser.textContent = "…";
    const proche = !commune && (tropProche(texte, m.vraie, m.cadre) || await memeSens(motId, texte, F.seuil, m.cadre));
    poser.disabled = false; poser.innerHTML = libelle;
    // Refus sans révéler la vérité : l'arbitre se trompe parfois (1 piège sans rapport sur 784 refusé à tort),
    // le joueur réécrit. Pas de triche possible : une question tentée ne lui sera plus posée.
    if (proche) { vusLocal.add(motId); err.innerHTML = `<p class="alerte">Trop proche de l'original.</p>`; ta.focus(); return; }
    if (!db) { err.innerHTML = `<p class="alerte">Mémoire partagée indisponible.</p>`; return; }
    if (solde(index()) < prix) { err.innerHTML = reserve(solde(index()), prix); return; }
    // Un seul pseudo par joueur : signer autrement le change partout (décision de l'auteur, 23/11/2026).
    const signe = document.getElementById("signeChamp"), sig = signe.value.replace(/\s+/g, " ").trim().slice(0, PSEUDO_MAX);
    if (sig.length < 2) { signe.focus(); signe.classList.add("refus"); return; }
    if (sig !== monPseudo()) {
      try { const r = await db.doc(`joueurs/${moi}`).set({ pseudo: sig, t: Date.now() }); S.pseudos.set(moi, (r && r.pseudo) || sig); }
      catch (e) { if (e && e.code === "doublon") { signe.classList.add("refus"); signe.focus(); err.innerHTML = `<p class="alerte">Cette signature est déjà prise.</p>`; return; } }
    }
    poser.disabled = true;
    try {
      const cat = $e.querySelector('.cat[aria-checked="true"]');
      await db.collection("pieges").add({ mot: motId, texte, auteur: moi, cree: Date.now(), ...(direct ? { prix } : {}), ...(cat ? { categorie: cat.dataset.cat } : {}) });
      if (serie) serie.pieges++;
      const reste = solde(index());
      $e.innerHTML = `${enteteEcus(reste, prix)}
        <div class="grosse-ic apparait">${IC.piege}</div>
        <div class="chips"><span class="chip bon">${IC.ok} En vente</span>${pastilleEcus(prix, "−")}</div>
        <div class="ligne">${!direct && reste >= PRIX_PIEGE ? `<button class="bouton piege" type="button" id="encore">Encore</button>` : ""}<button class="bouton plein" type="button" id="suivant">Continuer</button></div>`;
      const enc = document.getElementById("encore"); if (enc) enc.onclick = () => choixFamille(retour);
      document.getElementById("suivant").onclick = retour;
      document.getElementById("suivant").focus();
    } catch (e) {
      poser.disabled = false;
      err.innerHTML = e && e.code === "solde" ? reserve(solde(index()), prix) : `<p class="alerte">${e && e.code === "quota_exceeded" ? "Plus de place." : e && e.code === "doublon" ? "Tu as déjà un faux ici." : e && e.code === "refuse" ? "Texte refusé." : e && e.code === "debit" ? "Trop vite : réessaie dans un instant." : "Échec de l'enregistrement."}</p>`;
    }
  };
  ta.focus();
}

// Secondes avant minuit à Paris.
function avantMinuit() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23" })
    .formatToParts(new Date()).map(x => [x.type, +x.value]));
  return 86400 - (p.hour * 3600 + p.minute * 60 + p.second);
}
const duree = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`; };
let minuteurDemain = 0;
/* Fin de la ration : ce que la journée a rapporté (écus des duels, victimes de ses faux),
   l'heure de la prochaine ration, et l'atelier pour dépenser. */
async function bilan() {
  let pire = null; for (const [id, n] of serie.piegeur) if (!pire || n > pire[1]) pire = [id, n];
  if (pire) await nommer([pire[0]]);
  const I = index(), j = aujourdhui(), mesIds = new Set(I.piegesMoi.map(p => p.id));
  const dupes = I.victimes.filter(v => mesIds.has(v.piege) && v.joueur !== moi && jourDe(v.t || 0) === j).length;
  const cases = serie.traces.map(n => n ? "🟩" : "🟥").join("");
  const partage = `Bonimenteur, vacation${RATION_ACTIVE ? ` du ${j.split("-").reverse().slice(0, 2).join("/")}` : ""} : +${serie.points} écus\n${cases}${dupes ? `\nMes faux ont dupé ${dupes} joueur${dupes > 1 ? "s" : ""}` : ""}`;
  $e.innerHTML = `${RATION_ACTIVE ? "" : `<h2 class="apparait">Fin de vacation</h2><div class="gros apparait" style="color:var(--ecu)">+${serie.points}${IC.ecu}</div>`}${RATION_ACTIVE ? `<div class="demain apparait" role="img" aria-label="Prochaine ration dans ${duree(avantMinuit())}"><span class="sablier" aria-hidden="true">${IC.sablier}</span><span id="compteRebours">${duree(avantMinuit())}</span></div>` : ""}
    <div class="cases" aria-hidden="true">${serie.traces.map(n => `<i class="${n ? "v" : ""}"></i>`).join("")}</div>
    <div class="chips">${RATION_ACTIVE ? `<span class="chip ecu" aria-label="${serie.points} écus gagnés aujourd'hui">+${serie.points}${IC.ecu}</span>` : ""}${dupes ? `<span class="chip faux" aria-label="${dupes} joueurs dupés par tes faux aujourd'hui">${IC.joueur} ${dupes}</span>${pastilleEcus(dupes, "+")}` : ""}</div>
    ${pire ? `<div class="chips"><span class="chip faux">${IC.piege} ${esc(nom(pire[0]))} ×${pire[1]}</span></div>` : ""}
    <div class="haut entete" style="justify-content:center">${pastilleEcus(solde(I))}</div>
    <button class="bouton piege" type="button" id="versAtelier">Passer à l'atelier</button>
    ${RATION_ACTIVE ? "" : `<button class="bouton plein" type="button" id="encore">Nouvelle vacation</button>`}
    <button class="bouton" type="button" id="copier">Partager</button>`;
  const enc = document.getElementById("encore"); if (enc) enc.onclick = nouvelleSerie;
  document.getElementById("versAtelier").onclick = () => { sousAtelier = "fabriquer"; montrer("atelier"); };
  const bc = document.getElementById("copier");
  bc.onclick = () => { try { navigator.clipboard.writeText(partage).then(() => { bc.textContent = "Copié"; }, () => { bc.textContent = "Copie impossible ici"; }); } catch (e) { bc.textContent = "Copie impossible ici"; } };
  // Le compte à rebours ne tourne que tant que l'écran est affiché ; à minuit, la ration revient.
  clearInterval(minuteurDemain);
  if (!RATION_ACTIVE) return;
  minuteurDemain = setInterval(() => {
    const el = document.getElementById("compteRebours");
    if (!el) return clearInterval(minuteurDemain);
    if (serie.jour !== aujourdhui()) { clearInterval(minuteurDemain); return nouvelleSerie(); }
    el.textContent = duree(avantMinuit());
  }, 30000);
}

function plusDeMots() {
  $e.innerHTML = `${serie ? entete() : ""}<div class="grosse-ic">${IC.definition}</div><p class="centre">Plus aucun lot à expertiser.</p>
    <div class="ligne"><button class="bouton piege" type="button" id="versAtelier">Contrefaire</button>${serie && serie.num ? `<button class="bouton" type="button" id="bilanBtn">Bilan</button>` : ""}</div>`;
  document.getElementById("versAtelier").onclick = () => { sousAtelier = "fabriquer"; montrer("atelier"); };
  const b = document.getElementById("bilanBtn"); if (b) b.onclick = bilan;
}

/* Atelier */
/* L'atelier a deux sous-onglets : « Fabriquer » (choisir une famille, écrire un faux) et
   « Mes faux » (ses faux en circulation, leurs victimes, la galerie). Par défaut : Fabriquer
   si le joueur a de quoi payer un faux, sinon Mes faux. */
let sousAtelier = null;
function sousOnglets(actif, I) {
  const n = I.piegesMoi.length;
  return `<div class="sous-onglets" role="tablist" aria-label="Atelier"><button type="button" role="tab" data-sous="fabriquer" aria-selected="${actif === "fabriquer"}">${IC.piege} Contrefaire</button><button type="button" role="tab" data-sous="faux" aria-selected="${actif === "faux"}">Sur le marché <span class="nb">${n}</span></button></div>`;
}
function lierSous() { $e.querySelectorAll("[data-sous]").forEach(b => b.onclick = () => atelier(b.dataset.sous)); }
async function atelier(sous) {
  if (typeof sous === "string") sousAtelier = sous;
  const I = index();
  if (!sousAtelier) sousAtelier = solde(I) >= PRIX_PIEGE ? "fabriquer" : "faux";
  if (sousAtelier === "fabriquer") return choixFamille(atelier);
  const mes = I.piegesMoi.slice().sort((a, b) => (b.cree || 0) - (a.cree || 0));
  const total = mes.reduce((s, p) => s + (I.pris.get(p.id) || 0), 0);
  const vivants = mes.filter(p => !I.mort.has(p.id) && !I.retire.has(p.id)).length;
  const s = solde(I);
  const galerie = S.pieges.filter(p => I.pvqn.has(p.id)).sort((a, b) => taux(I, b.id) - taux(I, a.id));
  await nommer(galerie.map(p => p.auteur));
  // Mèche : un piège sans victime se consume d'un cran à chaque lecture ; à MORT_VUS il est démasqué.
  // Dès la première victime, il est sauvé pour de bon : plus de mèche.
  const meche = v => `<div class="meche" role="img" aria-label="${MORT_VUS - v} démasquages avant de disparaître">${Array.from({length: MORT_VUS}, (_, i) => `<i class="${i < v ? "brule" : ""}"></i>`).join("")}</div>`;
  const etat = p => {
    if (I.retire.has(p.id)) return `<span class="chip faux">${IC.croix} Retiré du marché</span>`;
    if (I.mort.has(p.id)) return `<span class="chip faux">${IC.croix} Saisi</span>`;
    if (I.pvqn.has(p.id)) return `<span class="chip ecu">${IC.etoile} Pièce de maître</span>`;
    return "";
  };
  $e.innerHTML = `${sousOnglets("faux", I)}<div class="signature" id="signature"><span class="signe">Signé</span><button class="nom-signe" type="button" id="pseudoBtn" aria-label="Changer de pseudo">${monPseudo() ? esc(monPseudo()) : "ton pseudo"}${IC.plume}</button></div><div class="haut entete"><span class="chip" aria-label="${mes.length} pièges posés">${IC.piege} ${mes.length}</span><span class="chip faux" aria-label="${total} joueurs piégés">${IC.joueur} ${total}</span>${pastilleEcus(s)}</div>
    ${mes.length ? `<ul class="liste">${mes.map(p => { const v = I.demasque.get(p.id) || 0, n = I.pris.get(p.id) || 0; const mot = S.mots.get(p.mot); return `<li class="${I.mort.has(p.id) || I.retire.has(p.id) ? "eteint" : ""}"><span class="m">${esc(mot ? titre(mot) : p.mot)}</span><span>${esc(formater(p.texte, mot ? famille(mot) : "definition"))}</span>${!n && !I.mort.has(p.id) && !I.retire.has(p.id) ? meche(v) : ""}<span class="chips" style="justify-content:flex-start">${etat(p)}<span class="chip" aria-label="${v} joueurs l'ont démasqué">${IC.oeil} ${v}</span><span class="chip faux" aria-label="${n} joueurs piégés">${IC.joueur} ${n}</span>${n ? pastilleEcus(n, "+") : ""}</span></li>`; }).join("")}</ul>`
      : `<div class="grosse-ic">${IC.piege}</div>`}
    ${galerie.length ? `<h2>${IC.etoile} Pièces de maître</h2><ul class="liste">${galerie.map(p => { const mot = S.mots.get(p.mot); return `<li><span class="m">${esc(mot ? titre(mot) : p.mot)}</span><span>« ${esc(formater(p.texte, mot ? famille(mot) : "definition"))} »</span><span class="chips" style="justify-content:flex-start"><span class="chip">${IC.piege} ${esc(nom(p.auteur))}</span><span class="chip faux" aria-label="joueurs piégés">${IC.joueur} ${I.pris.get(p.id) || 0}</span></span></li>`; }).join("")}</ul>` : ""}`;
  lierSous();
  document.getElementById("pseudoBtn").onclick = editerPseudo;
}
function editerPseudo() {
  const zone = document.getElementById("signature");
  zone.innerHTML = `<span class="signe">Signé</span><input id="pseudoChamp" maxlength="${PSEUDO_MAX}" autocomplete="nickname" aria-label="Ton pseudo" value="${esc(monPseudo())}"><button class="bouton plein petit" type="button" id="pseudoOk" aria-label="Valider">${IC.ok}</button>`;
  const ch = document.getElementById("pseudoChamp"); ch.focus(); ch.select();
  const valider = async () => {
    const v = ch.value.replace(/\s+/g, " ").trim().slice(0, PSEUDO_MAX);
    if (v.length < 2) { ch.focus(); ch.classList.add("refus"); return; }
    try { const r = await db.doc(`joueurs/${moi}`).set({ pseudo: v, t: Date.now() }); S.pseudos.set(moi, (r && r.pseudo) || v); }
    catch (e) { if (e && e.code === "doublon") { ch.classList.add("refus"); ch.focus(); return; } }
    atelier();
  };
  document.getElementById("pseudoOk").onclick = valider;
  ch.onkeydown = e => { if (e.key === "Enter") valider(); else if (e.key === "Escape") atelier(); ch.classList.remove("refus"); };
}

/* Pendant ton absence : à l'ouverture, les victimes de tes pièges depuis ta dernière visite
   (dernière visite gardée dans ce navigateur ; dans le vrai jeu, sur le serveur). */
async function absence() {
  let depuis = null; try { depuis = +localStorage.getItem("dm-visite") || null; } catch (e) {}
  try { localStorage.setItem("dm-visite", String(Date.now())); } catch (e) {}
  if (!depuis) return false;
  const I = index();
  const mesIds = new Map(I.piegesMoi.map(p => [p.id, p]));
  const victimes = I.victimes.filter(v => mesIds.has(v.piege) && v.joueur !== moi && (v.t || 0) > depuis);
  if (!victimes.length) return false;
  const parPiege = new Map();
  for (const v of victimes) { if (!parPiege.has(v.piege)) parPiege.set(v.piege, []); parPiege.get(v.piege).push(v.joueur); }
  await nommer(victimes.map(c => c.joueur));
  const initiale = id => esc((nom(id) || "?").charAt(0).toUpperCase());
  $e.innerHTML = `<h2 style="text-align:center">Tes faux ont trouvé preneur</h2>
    <div class="gros apparait" aria-label="${victimes.length} victimes">${victimes.length}</div>
    <div class="chips">${IC.joueur}${pastilleEcus(victimes.length, "+")}</div>
    <ul class="liste">${[...parPiege].map(([id, js]) => { const p = mesIds.get(id), mot = S.mots.get(p.mot); return `<li><span class="m">${esc(mot ? titre(mot) : p.mot)}</span><span>${esc(formater(p.texte, mot ? famille(mot) : "definition"))}</span><span class="victimes">${[...new Set(js)].map(j => `<span class="victime"><b aria-hidden="true">${initiale(j)}</b>${esc(nom(j))}</span>`).join("")}</span></li>`; }).join("")}</ul>
    <button class="bouton plein" type="button" id="jouerAbsence">Expertise</button>`;
  document.getElementById("jouerAbsence").onclick = () => montrer("jouer");
  return true;
}

/* Navigation */
function montrer(nom) {
  ecran = nom;
  document.querySelectorAll(".onglets button").forEach(b => b.setAttribute("aria-selected", b.dataset.ecran === nom ? "true" : "false"));
  if (nom === "atelier") atelier(); else if (serie && serie.jour === aujourdhui()) suite(); else nouvelleSerie();
}
document.querySelectorAll(".onglets button").forEach(b => b.onclick = () => montrer(b.dataset.ecran));

/* Démarrage */
const pret = () => S.charge.mots && S.charge.pieges && S.charge.choix;
(async () => {
  const minuteur = setTimeout(() => { if (!pret()) $e.innerHTML = `<p class="alerte">Les mots ne répondent pas encore. Vérifie ta connexion : il faut être connecté à claude.ai pour jouer.</p>`; }, 10000);
  try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch (e) { db = null; }
  if (!db) { clearTimeout(minuteur); $e.innerHTML = `<p class="alerte">La mémoire partagée du jeu n'est pas disponible ici. Ouvre la page sur claude.ai, connecté à ton compte.</p>`; return; }
  try { moi = user ? await user.id() : null; } catch (e) { moi = null; }
  if (!moi) moi = "anonyme";
  nommer([moi]).catch(() => {});
  let lance = false;
  const quandPret = async () => { if (pret() && !lance) { lance = true; clearTimeout(minuteur); if (!(await absence())) montrer("jouer"); } else if (lance && ecran === "atelier") atelier(); };
  db.collection("mots").onSnapshot(s => { S.mots = new Map(s.docs.map(d => [d.id, d.data()])); if (!s.metadata.fromCache) S.charge.mots = true; quandPret(); }, () => { S.charge.mots = true; quandPret(); });
  db.collection("pieges").limit(1000).onSnapshot(s => { S.pieges = s.docs.map(d => ({id: d.id, ...d.data()})); if (!s.metadata.fromCache) S.charge.pieges = true; quandPret(); }, () => { S.charge.pieges = true; quandPret(); });
  db.collection("joueurs").onSnapshot(s => { S.pseudos = new Map(s.docs.map(d => [d.id, String(d.data().pseudo || "").slice(0, PSEUDO_MAX)]).filter(x => x[1])); if (lance && ecran === "atelier" && sousAtelier === "faux" && !document.getElementById("pseudoChamp")) atelier(); }, () => {});
  db.collection("contestations").limit(1000).onSnapshot(s => { S.contest = s.docs.map(d => d.data()); if (lance && ecran === "atelier") atelier(); }, () => {});
  db.collection("choix").limit(1000).onSnapshot(s => { S.choix = s.docs.map(d => ({id: d.id, ...d.data()})); if (!s.metadata.fromCache) S.charge.choix = true; quandPret(); }, () => { S.charge.choix = true; quandPret(); });
})();
</script>
